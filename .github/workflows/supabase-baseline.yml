name: Supabase Production Baseline

on:
  push:
    branches: [main]
    paths:
      - "supabase/baselines/**"
      - "scripts/validate-production-baseline.mjs"
      - ".github/workflows/supabase-baseline.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/baselines/**"
      - "scripts/validate-production-baseline.mjs"
      - ".github/workflows/supabase-baseline.yml"

permissions:
  contents: read

jobs:
  production-baseline-validation:
    name: Production baseline clean-room validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install isolated PostgreSQL WASM validator
        run: npm install --no-save --package-lock=false @electric-sql/pglite@0.5.16

      - name: Rebuild and verify the canonical Production schema snapshot
        run: node scripts/validate-production-baseline.mjs
