name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (lockfile is the single source of truth)
        run: npm ci

      - name: Type check + ESLint (errors gate)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (lockfile is the single source of truth)
        run: npm ci

      - name: Firestore rules emulator tests
        run: npm run test:rules

  security:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OSV vulnerability scan (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

  rls-policy-check:
    name: Supabase RLS policy static validation (SDV2-TEST-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify RLS policies documented in migration
        run: |
          echo "Checking that RLS policies are documented..."
          for table in profiles clinics clinic_subscriptions platform_config invitations patients day_logs adherence_configs adherence_scores fcm_tokens consents; do
            if ! grep -q "$table" supabase/migrations/20261031000000_baseline.sql; then
              echo "FAIL: Table $table not documented in baseline migration"
              exit 1
            fi
          done
          echo "All 11 tables documented in baseline migration"

      - name: Verify Edge Function source in repo
        run: |
          if [ ! -f "supabase/functions/notify/index.ts" ]; then
            echo "FAIL: Edge Function source not in repo (SDV2-CONF-002)"
            exit 1
          fi
          echo "Edge Function source present in repo"
