name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (lockfile is the single source of truth)
        run: npm ci

      - name: Type check + ESLint (errors gate)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build


  security:
    name: Dependency & secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OSV vulnerability scan (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json

      - name: Fetch pull request base history for secret scanning
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: Gitleaks secret scan
        if: ${{ always() }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

  rls-policy-check:
    name: Supabase RLS policy static validation (SDV2-TEST-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify explicit RLS enablement and policy coverage
        run: node scripts/check-supabase-rls.mjs

      - name: Verify Edge Function source in repo
        run: |
          if [ ! -f "supabase/functions/notify/index.ts" ]; then
            echo "FAIL: Edge Function source not in repo (SDV2-CONF-002)"
            exit 1
          fi
          echo "Edge Function source present in repo"

  cloudflare-worker-validation:
    name: Cloudflare Worker bundle validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Validate Cloudflare Worker bundle without deployment
        run: npx --yes wrangler@4.164.0 deploy --dry-run --outdir .wrangler-dry-run --config wrangler.jsonc
